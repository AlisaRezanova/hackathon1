# Конфиг nginx для контейнера frontend. Собирается в образ на этапе сборки
# (см. infra/Dockerfile.frontend — COPY, а не volume-mount) вместе со сборкой
# фронта (frontend/dist -> /usr/share/nginx/html) и проксирует /api/ на сервис
# backend по внутренней docker-сети (никакой host-nginx не нужен).
#
# Публичный вход на сервере организует внешний reverse-proxy (Caddy от другого
# проекта, который уже держит 80/443) — контейнер frontend подключается к его
# docker-сети декларативно через infra/docker-compose.deploy.yml (алиас
# hackathon-frontend), и там уже есть site-блок вида:
#
#   hr.ec9.ru {
#       reverse_proxy hackathon-frontend:80
#   }
#
# Локально (без deploy-оверлея) порт публикуется напрямую на 127.0.0.1:18080,
# см. infra/docker-compose.prod.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Загрузка транскриптов интервью может быть большой.
    client_max_body_size 10m;

    # API -> FastAPI. Все роуты бэкенда начинаются с /api/.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Запросы к LLM (OpenRouter) могут идти долго — иначе будет 504.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Файлы сборки Vite лежат в /assets с хешем в имени — можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Всё остальное — SPA: если файла нет (/app/interviews, /interview/<token>),
    # отдаём index.html, дальше маршрутизирует React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
