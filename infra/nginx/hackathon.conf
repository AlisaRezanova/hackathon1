# Конфиг nginx для деплоя. Кладётся на сервер в /etc/nginx/sites-available/hackathon,
# затем: sudo ln -s /etc/nginx/sites-available/hackathon /etc/nginx/sites-enabled/
# Проверка и применение: sudo nginx -t && sudo systemctl reload nginx
#
# ЗАМЕНИТЬ перед использованием:
#   your-domain.ru   — домен (или IP сервера, если домена нет)
#   /var/www/hackathon — куда скопирована сборка фронта (содержимое frontend/dist)
#   127.0.0.1:8000   — куда опубликован порт backend в docker-compose
#
# Если на сервере уже есть другой сайт на 80 порту: этот файл добавляется РЯДОМ,
# nginx различает сайты по server_name, поэтому нужен отдельный домен/поддомен.
# Если домена нет — поменять listen на свободный порт, например `listen 8080;`.
#
# HTTPS: после первого запуска `sudo certbot --nginx -d your-domain.ru` сам
# допишет listen 443 и редирект — руками это делать не нужно.

server {
    listen 80;
    server_name your-domain.ru;

    # Собранный фронт (npm run build -> frontend/dist).
    root /var/www/hackathon;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Загрузка транскриптов интервью может быть большой.
    client_max_body_size 10m;

    # API -> FastAPI. Все роуты бэкенда начинаются с /api/.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Запросы к LLM (OpenRouter) могут идти долго — иначе будет 504.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Файлы сборки Vite лежат в /assets с хешем в имени — можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Всё остальное — SPA: если файла нет (/app/interviews, /interview/<token>),
    # отдаём index.html, дальше маршрутизирует React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
