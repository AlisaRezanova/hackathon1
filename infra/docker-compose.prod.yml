# Продакшен-стек: PostgreSQL + backend. Фронт собирается отдельно (npm run build)
# и отдаётся nginx-ом с сервера, см. infra/nginx/hackathon.conf.
#
# Запуск из корня репозитория:
#   cp infra/.env.prod.example infra/.env.prod   # и заполнить
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod exec -T backend python -m scripts.seed
#
# Отличия от dev (docker-compose.yaml в корне): без --reload и без монтирования
# исходников, БД не публикуется наружу, backend слушает только 127.0.0.1
# (снаружи до него достучаться можно только через nginx).

# Явное имя проекта: контейнеры и тома не пересекутся с другими стеками на сервере.
name: hackathon-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в infra/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackathon} -d ${POSTGRES_DB:-hackathon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    # Образ по умолчанию стартует с --reload (это для dev) — здесь переопределяем.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в infra/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      CORS_ORIGINS: ${CORS_ORIGINS:?Задайте CORS_ORIGINS в infra/.env.prod}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash-0731}
    ports:
      # Порт можно поменять, если 8000 занят на сервере (и тогда же — proxy_pass в nginx).
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
